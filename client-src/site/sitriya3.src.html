<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sitraya Homepage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="google" content="notranslate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Outfit:wght@400;500;600;700;800&family=Anek+Bangla:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: luxury modest-fashion storefront — full-width campaign slider, floating cut-outs on soft stages, one 1320px column; skins: emerald (default) or noir to match the black brand cover. */
:root{
  --em-900:#082721; --em:#0F3B33; --em-700:#145044; --em-500:#1F6B5A; --em-50:#E9F2EE;
  --gold:#C9A35A; --gold-hi:#E9CF92; --gold-deep:#8E6C2E; --gold-50:#FBF3E1;
  --paper:#FFFFFF; --cream:#FBF7F0; --sand:#F3EBDD; --line:#EADFCC;
  --ink:#171512; --text:#2E2A24; --muted:#6A6459;
  --rose:#B3203F; --rose-50:#FCE9ED; --mint:#16A34A; --mint-50:#E7F7EC; --wa:#1DA851; --navy:#1E3A8A;
  --f-disp:"Playfair Display",Georgia,serif;
  --f-ui:"Outfit","Hind Siliguri",system-ui,sans-serif;
  --f-bn:"Anek Bangla","Hind Siliguri","Noto Sans Bengali",sans-serif;
  --f-bnb:"Hind Siliguri","Noto Sans Bengali",sans-serif;
  --r:16px; --r-lg:24px;
  --sh-1:0 2px 10px rgba(23,21,18,.06);
  --sh-2:0 18px 40px -18px rgba(15,59,51,.35);
  --sh-3:0 30px 70px -20px rgba(8,39,33,.45);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
html[data-skin="noir"]{--em-900:#060505;--em:#141210;--em-700:#29241F;--em-500:#5A4B3A;--em-50:#F2EDE5;--sh-2:0 18px 40px -18px rgba(0,0,0,.4);--sh-3:0 30px 70px -20px rgba(0,0,0,.55)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
body{margin:0}
body{background:var(--cream);color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="bn"] body{font-family:var(--f-bnb)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{display:block;max-width:100%}
h1,h2,h3,h4{margin:0;text-wrap:balance}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic .d{fill:currentColor;stroke:none;opacity:.16}
.ic .g{stroke:var(--gold)}
.ic .gf{fill:var(--gold);stroke:none}

/* motion */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shadow{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.55}50%{transform:translateX(-50%) scaleX(.78);opacity:.32}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes shine{from{left:-60%}to{left:130%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(29,168,81,.55)}100%{box-shadow:0 0 0 18px rgba(29,168,81,0)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(20px,-120px);opacity:0}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes glint{0%,100%{opacity:.0}50%{opacity:.5}}
.floaty{animation:float var(--d,6s) ease-in-out infinite;animation-delay:var(--dl,0s);will-change:transform}
.stage-shadow{position:absolute;left:50%;bottom:4%;width:56%;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent);animation:shadow var(--d,6s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s var(--ease),transform .8s var(--ease) !important}
.rv.in{opacity:1;transform:none}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border-radius:999px;font-weight:700;font-size:15.5px;letter-spacing:.01em;transition:transform .25s var(--ease),box-shadow .25s,background .25s,color .25s;white-space:nowrap}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)}
.btn:hover{transform:translateY(-2px)}
.btn:hover::after{animation:shine .8s ease}
.btn .ic{width:19px;height:19px}
.b-gold{background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,#B48A3E);color:#1A140A;box-shadow:0 10px 24px -10px rgba(180,138,62,.8)}
.b-em{background:var(--em);color:#fff;box-shadow:0 10px 24px -12px rgba(15,59,51,.9)}
.b-em:hover{background:var(--em-700)}
.b-ink{background:var(--ink);color:#fff}
.b-wa{background:var(--wa);color:#fff}
.b-navy{background:var(--navy);color:#fff}
.b-ghost{border:2px solid currentColor;background:transparent}
.b-out{border:2px solid var(--em);color:var(--em);background:#fff}
.b-out:hover{background:var(--em);color:#fff}

/* ticker */
.ticker{position:relative;background:var(--em-900);color:#F3EAD6;font-size:14px;font-weight:500;overflow:hidden;white-space:nowrap}
.ticker .track{display:inline-flex;gap:48px;padding:9px 0;animation:marquee 36s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker span{display:inline-flex;align-items:center;gap:12px}
.ticker i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);display:inline-block}

/* header */
.mast{background:var(--paper);position:relative;z-index:41}
.mast .wrap{display:flex;align-items:center;gap:26px;min-height:92px}
.logo{display:flex;align-items:center;flex:none}
.logo img{height:58px;width:auto;transition:transform .5s var(--ease)}
.logo:hover img{transform:scale(1.04)}
.sbox{flex:1;max-width:540px;margin:0 auto;display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 20px;border-radius:999px;background:var(--cream);border:1.5px solid var(--line);transition:border-color .2s,box-shadow .2s;cursor:text}
.sbox:hover{border-color:var(--gold);box-shadow:0 0 0 5px rgba(201,163,90,.12)}
.sbox span{flex:1;color:var(--muted);font-size:15px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:opacity .25s}
.sbox b{width:42px;height:42px;border-radius:50%;background:var(--em);color:var(--gold-hi);display:grid;place-items:center}
.acts{display:flex;align-items:center;gap:2px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:66px;min-height:54px;padding:5px 6px;border-radius:14px;font-size:12.5px;font-weight:600;color:var(--text);position:relative;transition:background .2s,color .2s}
.act:hover{background:var(--gold-50);color:var(--em)}
.act .ic{width:25px;height:25px}
.cnt{position:absolute;top:0;right:10px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--rose);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-style:normal;font-variant-numeric:tabular-nums;border:2px solid #fff}
.cnt.em{background:var(--em)}
.bump{animation:bump .5s var(--ease)}
.burger{display:none}
.lang{display:inline-flex;align-items:center;padding:3px;border-radius:999px;background:var(--cream);border:1.5px solid var(--line);margin-right:6px}
.lang button{min-width:44px;min-height:36px;padding:0 10px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted);transition:all .25s}
.lang button[aria-pressed="true"]{background:var(--em);color:#fff}

.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--em);box-shadow:0 8px 24px -16px rgba(0,0,0,.6)}
.navbar .wrap{display:flex;align-items:center;gap:4px;min-height:56px}
.navbar a.nl{position:relative;display:inline-flex;align-items:center;gap:6px;padding:0 14px;min-height:56px;color:#EAF1EE;font-weight:600;font-size:15.5px;transition:color .2s}
.navbar a.nl::after{content:"";position:absolute;left:14px;right:14px;bottom:11px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.navbar a.nl:hover{color:#fff}
.navbar a.nl:hover::after{transform:scaleX(1)}
.navbar .offer{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#1A140A !important;border-radius:999px;min-height:38px !important;margin-right:8px;padding:0 16px !important}
.navbar .offer::after{display:none}
.navbar .offer .ic{width:18px;height:18px}
.navbar .right{margin-left:auto;display:flex;gap:18px;color:#C8D6D0;font-size:14px;font-weight:500}
html[data-skin="noir"] .navbar .right{color:#CFC6B8}
.navbar .right a:hover{color:var(--gold-hi)}

/* hero slider */
.hero{padding-block:24px 0}
.slider{position:relative;border-radius:var(--r-lg);overflow:hidden;height:clamp(520px,42vw,560px);box-shadow:var(--sh-3);isolation:isolate;background:#0a0a0a}
.sl{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;padding:44px 64px;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s}
.sl.on{opacity:1;visibility:visible}
.sl::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--bg)}
.sl::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 74% 48%,var(--glow) 0,transparent 44%),repeating-radial-gradient(circle at 74% 48%,transparent 0 46px,rgba(255,255,255,.035) 46px 47px)}
.sl .copy{display:flex;flex-direction:column;align-items:flex-start;gap:14px;color:#fff;position:relative;z-index:2;max-width:560px}
.sl .copy > *{opacity:0;transform:translateY(24px)}
.sl.on .copy > *{animation:rise .8s var(--ease) forwards}
.sl.on .copy > *:nth-child(2){animation-delay:.1s}.sl.on .copy > *:nth-child(3){animation-delay:.2s}.sl.on .copy > *:nth-child(4){animation-delay:.3s}.sl.on .copy > *:nth-child(5){animation-delay:.4s}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 16px 7px 8px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:14px;font-weight:600;letter-spacing:.03em;backdrop-filter:blur(4px)}
.pill b{background:var(--gold);color:#1A140A;border-radius:999px;padding:2px 10px;font-size:12px;letter-spacing:.06em}
.sl h1,.sl h2{font-family:var(--f-bn);font-weight:800;font-size:clamp(44px,5.4vw,78px);line-height:1.02;letter-spacing:-.01em;background:linear-gradient(180deg,#fff 25%,var(--gold-hi) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:6px}
html[lang="en"] .sl h1,html[lang="en"] .sl h2{font-family:var(--f-disp)}
.sl p{margin:0;font-size:18px;line-height:1.7;color:rgba(255,255,255,.88);max-width:440px}
.from{display:flex;align-items:baseline;gap:10px;font-weight:600;color:rgba(255,255,255,.8);font-size:16.5px}
.from strong{font-family:var(--f-ui);font-size:32px;font-weight:800;color:#fff}
.sl .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.sl .cta .b-ghost{color:#fff}
.sl .art{position:relative;height:100%;min-height:380px}
.sl .art .fig{position:absolute;bottom:3%;transition:transform 1.1s var(--ease),opacity 1.1s}
.sl .art .fig img{width:100%;filter:drop-shadow(0 26px 22px rgba(0,0,0,.45))}
.sl .art .fig.main{left:24%;width:56%;z-index:3}
.sl .art .fig.b1{left:0;width:42%;z-index:2;bottom:9%;opacity:.92}
.sl .art .fig.b2{right:-2%;width:40%;z-index:1;bottom:11%;opacity:.85}
.sl:not(.on) .art .fig{opacity:0;transform:translateX(60px) scale(.94)}
.ring{position:absolute;left:52%;top:46%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;border:2px dashed rgba(233,207,146,.38);animation:spin 40s linear infinite}
.ring.r2{width:290px;height:290px;margin:-145px 0 0 -145px;border:1px solid rgba(233,207,146,.25);animation-duration:26s;animation-direction:reverse}
.pedestal{position:absolute;left:52%;bottom:1%;width:72%;height:46px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(233,207,146,.45),rgba(233,207,146,0))}
.spark{position:absolute;width:9px;height:9px;background:var(--gold-hi);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 3.2s ease-in-out infinite}
/* image slide (cover / uploaded banner) */
.sl.pic{display:block;padding:0;background:var(--bg)}
.sl.pic::after{display:none}
.sl.pic .full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.sl.pic.on .full{animation:kenburns 9s ease-out forwards}
.sl.pic .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.45) 38%,rgba(0,0,0,0) 64%)}
.sl.pic .copy{position:absolute;left:64px;top:50%;transform:translateY(-50%)}
.sl.pic .solo{position:absolute;left:clamp(24px,6.5%,96px);bottom:30px;z-index:3;display:flex;gap:12px;opacity:0;transform:translateY(20px);transition:opacity .8s .5s,transform .8s .5s var(--ease)}
.sl.pic.on .solo{opacity:1;transform:none}
.sl.pic .glint{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,240,210,.18) 50%,transparent 60%);animation:glint 6s ease-in-out infinite;pointer-events:none}
.sl .empty-art{position:absolute;inset:16% 10%;border:2px dashed rgba(255,255,255,.35);border-radius:20px;display:grid;place-items:center;color:rgba(255,255,255,.75);font-weight:600;text-align:center;padding:20px}
.sctl{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.28);backdrop-filter:blur(6px)}
.sdot{width:10px;height:10px;border-radius:5px;background:rgba(255,255,255,.45);transition:width .4s,background .4s}
.sdot[aria-current="true"]{width:34px;background:var(--gold-hi)}
.sarr{position:absolute;top:50%;z-index:5;width:48px;height:48px;margin-top:-24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);transition:background .2s,transform .2s,opacity .3s;opacity:0}
.slider:hover .sarr,.sarr:focus-visible{opacity:1}
.sarr:hover{background:rgba(255,255,255,.28);transform:scale(1.06)}
.sarr.p{left:16px}.sarr.n{right:16px}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--gold-hi);width:0;z-index:6}

/* promo row */
.promos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
.promo{position:relative;border-radius:var(--r-lg);overflow:hidden;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;min-height:230px;box-shadow:var(--sh-2);transition:transform .4s var(--ease),box-shadow .4s;background:var(--pbg)}
.promo:hover{transform:translateY(-6px);box-shadow:var(--sh-3)}
.promo .k{font-weight:700;font-size:15px;color:var(--pk,var(--gold-deep))}
.promo h3{font-family:var(--f-bn);font-weight:800;font-size:clamp(24px,2.2vw,30px);line-height:1.08;color:var(--ph,var(--ink));max-width:58%}
html[lang="en"] .promo h3{font-family:var(--f-disp)}
.promo .pr{font-weight:700;color:var(--ph,var(--em));font-size:15px;opacity:.9}
.promo .lnk{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-weight:700;font-size:14.5px;color:var(--ph,var(--em));border-bottom:2px solid var(--gold);padding-bottom:2px}
.promo .lnk .ic{width:16px;height:16px;transition:transform .25s}
.promo:hover .lnk .ic{transform:translateX(4px)}
.promo .ph{position:absolute;right:2%;bottom:0;width:44%;height:100%}
.promo .ph .floaty{position:absolute;inset:6% 0 4% 0}
.promo .ph img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 16px rgba(0,0,0,.25))}
.promo .ph.full{inset:0;width:100%}
.promo .ph.full img{object-fit:cover;filter:none}
.promo .ph.full::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 70%)}
.promo.has-full{--ph:#fff;--pk:var(--gold-hi)}
.promo > *:not(.ph){position:relative;z-index:2}
.promo::before{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;background:var(--blob)}

/* trust */
.trust{padding-block:22px 0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tr{display:flex;align-items:center;gap:16px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:var(--r);transition:transform .3s var(--ease),box-shadow .3s}
.tr:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.badge{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--em);background:radial-gradient(circle at 35% 30%,#fff,var(--gold-50) 70%);box-shadow:inset 0 0 0 1.5px rgba(201,163,90,.65),0 10px 22px -12px rgba(201,163,90,.9);transition:transform .5s var(--ease),background .4s,color .4s}
.badge .ic{width:28px;height:28px}
.tr:hover .badge{transform:rotate(-10deg) scale(1.08);background:radial-gradient(circle at 35% 30%,var(--em-500),var(--em-900));color:var(--gold-hi)}
.tr b{display:block;font-weight:700;font-size:17px;color:var(--ink);line-height:1.25}
.tr span{font-size:14px;color:var(--muted)}

/* section heads */
.sec{padding-block:76px 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:30px}
.head.center{flex-direction:column;align-items:center;text-align:center}
.kick{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep)}
html[lang="en"] .kick{font-family:var(--f-bn);text-transform:none;letter-spacing:0;font-size:17px}
.kick::before{content:"";width:28px;height:2px;background:var(--gold)}
.head.center .kick::after{content:"";width:28px;height:2px;background:var(--gold)}
.head h2{font-family:var(--f-bn);font-weight:800;font-size:clamp(32px,3.6vw,50px);line-height:1.1;color:var(--ink);margin-top:6px}
html[lang="en"] .head h2{font-family:var(--f-disp)}
.seeall{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--em);min-height:44px;border-bottom:2px solid var(--gold)}
.seeall .ic{width:18px;height:18px;transition:transform .25s}
.seeall:hover .ic{transform:translateX(5px)}

/* categories */
.carousel{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 6*18px)/7);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 2px 18px}
.rail::-webkit-scrollbar{display:none}
.cat{scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.cat .tile{display:block;position:relative;width:100%;aspect-ratio:1;border-radius:28px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-1);overflow:hidden;transition:transform .45s var(--ease),box-shadow .45s,border-color .3s}
.cat .tile::before{content:"";position:absolute;left:50%;top:54%;width:76%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--tint)}
.cat .tile .floaty{position:absolute;inset:8% 12% 0}
.cat .tile img{width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 12px 10px rgba(0,0,0,.2));transition:transform .5s var(--ease)}
.cat:hover .tile{transform:translateY(-8px);box-shadow:var(--sh-2);border-color:var(--gold)}
.cat:hover .tile img{transform:scale(1.08)}
.cat b{font-weight:700;font-size:17px;color:var(--ink);line-height:1.25}
.cat small{display:block;font-weight:600;font-size:13.5px;color:var(--gold-deep)}
.rarr{position:absolute;top:38%;z-index:3;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1A140A;box-shadow:var(--sh-2);transition:transform .2s,opacity .2s}

/* top selling */
.big2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.bigc{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:20px;padding:26px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s}

.bigc .stg{position:relative;display:block;width:100%;aspect-ratio:4/5}
.bigc .stg::before{content:"";position:absolute;inset:8% 4% 6%;border-radius:50% 50% 46% 46%;background:var(--tint)}
.bigc .stg .floaty{position:absolute;inset:0 6% 8%}
.bigc .stg img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 22px 18px rgba(0,0,0,.25))}
.ribbon{position:absolute;top:0;right:28px;padding:7px 14px;background:var(--rose);color:#fff;font-weight:700;font-size:13px;border-radius:0 0 10px 10px;display:flex;gap:6px;align-items:center;z-index:2}
.ribbon .ic{width:16px;height:16px}
.bigc .info{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.bigc .cl{font-weight:700;color:var(--gold-deep);font-size:15px}
.bigc h3{font-weight:800;font-size:clamp(22px,2vw,28px);line-height:1.2;color:var(--ink)}
.bigc .alt{font-weight:600;color:var(--muted);font-size:15.5px;margin-top:-6px}
.prc{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.prc .now{font-family:var(--f-ui);font-weight:800;color:var(--em);font-size:22px}
html[data-skin="noir"] .prc .now{color:var(--gold-deep)}
.prc s{color:#9A9387;font-size:15px}
.save{display:inline-flex;padding:3px 10px;border-radius:999px;background:var(--mint-50);color:#11733A;font-weight:700;font-size:13px}
.bigc .prc .now{font-size:30px}
.bigc .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.bigc .btns .btn{min-height:46px;padding:0 20px;font-size:14.5px}

/* brand banner */
.brandban{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:460px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;background:linear-gradient(120deg,#F8F2E8 0%,#EEE4D2 60%,#E4D7BF 100%);box-shadow:var(--sh-2)}
.brandban::before{content:"";position:absolute;right:-8%;top:-30%;width:70%;height:160%;background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 40px,rgba(255,255,255,.35) 40px 44px);opacity:.6;transform:rotate(6deg)}
.bb-copy{position:relative;z-index:2;padding:48px 0 48px 56px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.bb-copy .lg{height:110px;width:auto}
.bb-copy h3{font-family:var(--f-bn);font-weight:800;font-size:clamp(30px,3.2vw,44px);line-height:1.1;color:var(--ink)}
html[lang="en"] .bb-copy h3{font-family:var(--f-disp)}
.bb-copy .line1{font-weight:600;font-size:18px;color:var(--gold-deep)}
.vals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:560px;margin-block:6px 8px}
.val{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13.5px;font-weight:600;color:var(--text);line-height:1.25}
.val + .val{border-left:1px solid rgba(142,108,46,.25)}
.val .ic{width:30px;height:30px;color:var(--em)}
.bb-stage{position:relative;height:100%;min-height:460px;z-index:1}
.plinth{position:absolute;bottom:0;border-radius:14px 14px 0 0;background:linear-gradient(90deg,#E9E3D8,#FFFFFF 45%,#E6DED0);box-shadow:inset 0 10px 18px -12px rgba(0,0,0,.25)}
.plinth::before{content:"";position:absolute;left:0;right:0;top:-14px;height:28px;border-radius:50%;background:linear-gradient(90deg,#F2EDE4,#FFFFFF,#EDE6DA)}
.bb-stage .fig{position:absolute;z-index:2}
.bb-stage .fig img{width:100%;filter:drop-shadow(0 20px 16px rgba(0,0,0,.25))}

/* products */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{min-height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14.5px;transition:all .25s var(--ease)}
.tab:hover{border-color:var(--em);color:var(--em)}
.tab[aria-selected="true"]{background:var(--em);border-color:var(--em);color:#fff;box-shadow:0 10px 20px -12px rgba(15,59,51,.9)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s,border-color .3s}
.card:hover{transform:translateY(-8px);box-shadow:var(--sh-2);border-color:transparent}
.card .stg{position:relative;aspect-ratio:1/1.08;background:linear-gradient(180deg,#fff,var(--tint))}
.card .stg::before{content:"";position:absolute;left:50%;top:52%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,255,255,0))}
.card .stg .floaty{position:absolute;inset:8% 10% 6%}
.card .stg img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 14px rgba(0,0,0,.22));transition:transform .5s var(--ease)}
.card:hover .stg img{transform:scale(1.07)}
.card .open{position:absolute;inset:0;z-index:2}
.tag{position:absolute;top:12px;z-index:3;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;color:#fff}
.tag.l{left:12px;background:var(--em)}
.tag.r{right:12px;background:var(--mint)}
.heart{position:absolute;right:10px;bottom:10px;z-index:3;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--rose);display:grid;place-items:center;box-shadow:var(--sh-1);transition:transform .25s var(--ease)}

.heart .ic .d{opacity:0}
.heart[aria-pressed="true"] .ic .d{opacity:1}
.card .bd{padding:16px 16px 18px;display:flex;flex-direction:column;gap:5px;flex:1}
.card .nm{font-weight:700;font-size:17px;line-height:1.3;color:var(--ink);text-align:left}
.card .nm:hover{color:var(--em-500)}
.card .alt{font-weight:500;font-size:14px;color:var(--muted);line-height:1.3}
.card .prc{margin-top:auto;padding-top:6px}
.card .add{margin-top:10px;min-height:46px;width:100%;border-radius:12px;font-size:15px}
.empty{grid-column:1/-1;padding:48px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r);font-size:17px}

/* newsletter + footer */
.news{position:relative;margin-top:88px;background:radial-gradient(circle at 85% 20%,rgba(233,207,146,.18),transparent 40%),linear-gradient(120deg,var(--em-900),var(--em) 60%,var(--em-700));color:#fff;overflow:hidden}
.news .wrap{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:62px}
.news h2{font-family:var(--f-bn);font-weight:800;font-size:clamp(30px,3.4vw,46px);line-height:1.15}
html[lang="en"] .news h2{font-family:var(--f-disp)}
.news p{margin:10px 0 0;color:rgba(255,255,255,.82);font-size:16.5px}
.nform{display:flex;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px}
.nform input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font-size:16px;padding:0 18px;outline:none}
.nform input::placeholder{color:rgba(255,255,255,.62)}
.nmsg{margin-top:10px;font-size:14.5px;min-height:22px;color:var(--gold-hi)}
.leafy{position:absolute;width:10px;height:16px;border-radius:0 100% 0 100%;background:rgba(233,207,146,.35);animation:drift linear infinite}

.ftr{background:#fff;border-top:1px solid var(--line)}
.ftr .wrap{padding-block:60px 0}
.fcols{display:grid;grid-template-columns:1.6fr repeat(4,minmax(0,1fr));gap:36px}
.ftr .lg{height:74px;width:auto}
.ftr .about{color:var(--muted);font-size:15px;line-height:1.75;margin:16px 0}
.ftr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.ftr h4{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:18px}
.ftr ul a{color:var(--muted);transition:color .2s,padding .2s}
.ftr ul a:hover{color:var(--em);padding-left:4px}
.ci li{display:flex;gap:10px;align-items:center;color:var(--text)}
.ci .ic{width:20px;height:20px;color:var(--em)}
.soc{display:flex;gap:10px;margin-top:20px}
.soc a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,var(--gold-50) 70%);box-shadow:inset 0 0 0 1.5px rgba(201,163,90,.55);color:var(--gold-deep);transition:background .25s,color .25s,transform .25s}
.soc a:hover{background:var(--em);color:var(--gold-hi);transform:translateY(-3px)}
.soc .ic{width:20px;height:20px}
.fbot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:44px;padding-block:22px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.pays{display:flex;gap:8px;flex-wrap:wrap}
.pays span{padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--ink);background:var(--cream)}
.pays .bk{color:#D12053}.pays .ng{color:#E8590C}.pays .rk{color:#7C2D92}

/* floating widgets */
.minicart{position:fixed;right:0;top:50%;z-index:45;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;border-radius:14px 0 0 14px;overflow:hidden;box-shadow:var(--sh-3);transition:transform .3s var(--ease)}
.minicart:hover{transform:translateY(-50%) translateX(-4px)}
.minicart .t{background:var(--em);color:#fff;padding:12px 14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600}
.minicart .t .ic{color:var(--gold-hi);width:26px;height:26px}
.minicart .b{background:#fff;color:var(--em);font-weight:800;font-size:14px;padding:8px 10px;width:100%;text-align:center;font-variant-numeric:tabular-nums}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:45;width:58px;height:58px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(29,168,81,.8);animation:pulse 2.2s infinite}
.fab .ic{width:28px;height:28px}
.totop{position:fixed;right:max(26px,calc(env(safe-area-inset-right,0px) + 6px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:45;width:46px;height:46px;border-radius:50%;background:var(--gold);color:#1A140A;display:grid;place-items:center;box-shadow:var(--sh-2);opacity:0;transform:translateY(16px);pointer-events:none;transition:all .3s var(--ease)}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.czbtn{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:46;display:flex;align-items:center;gap:8px;min-height:50px;padding:0 20px 0 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14.5px;box-shadow:0 16px 34px -14px rgba(0,0,0,.6);transition:transform .25s var(--ease)}
.czbtn:hover{transform:translateY(-3px)}
.czbtn .ic{color:var(--gold-hi)}
.tabbar{display:none}

/* overlays */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(8,14,12,.5);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:80;width:min(460px,100%);background:var(--cream);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .5s var(--ease);box-shadow:-30px 0 60px -30px rgba(0,0,0,.4);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dhd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;background:#fff;border-bottom:1px solid var(--line)}
.dhd h2{font-family:var(--f-bn);font-weight:800;font-size:26px;color:var(--ink);display:flex;align-items:center;gap:10px}
html[lang="en"] .dhd h2{font-family:var(--f-disp)}
.dhd h2 small{font-family:var(--f-ui);font-size:13px;font-weight:700;background:var(--em);color:#fff;border-radius:999px;padding:3px 10px}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cream);transition:background .2s,transform .3s;flex:none}
.x:hover{background:var(--sand);transform:rotate(90deg)}
.freebar{padding:14px 22px 16px;background:#fff;border-bottom:1px solid var(--line)}
.freebar p{margin:0 0 10px;font-size:15px;font-weight:500}
.freebar p b{color:var(--em)}
.fb-track{position:relative;height:8px;border-radius:4px;background:var(--sand)}
.fb-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--em-500),var(--gold));transition:width .6s var(--ease)}
.fb-truck{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--em);color:var(--gold-hi);display:grid;place-items:center;transition:left .6s var(--ease);box-shadow:var(--sh-1)}
.fb-truck .ic{width:16px;height:16px}
.dbd{flex:1;overflow:auto;padding:14px 22px}
.ln{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;animation:rise .45s var(--ease) both}
.ln .th{width:86px;height:100px;border-radius:12px;background:var(--tint,var(--sand));display:grid;place-items:center;overflow:hidden}
.ln .th img{height:92%;object-fit:contain;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))}
.ln .tp{display:flex;justify-content:space-between;gap:8px}
.ln .tp b{font-weight:700;color:var(--ink);font-size:15.5px;line-height:1.3}
.ln .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ln .bt{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.ln .bt strong{font-weight:800;color:var(--em);font-variant-numeric:tabular-nums}
.trash{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s;flex:none}
.trash:hover{background:var(--rose-50);color:var(--rose)}
.trash .ic{width:18px;height:18px}
.stepper{display:inline-flex;align-items:center;background:var(--cream);border:1px solid var(--line);border-radius:999px}
.stepper button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:600}
.stepper button:hover{background:var(--sand)}
.stepper span{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ups h4{font-weight:700;font-size:16px;margin:8px 0 10px;color:var(--ink)}
.ups .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.up{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:13px;font-weight:700}
.up .th{height:86px;border-radius:8px;background:var(--tint);display:grid;place-items:center;margin-bottom:6px}
.up .th img{height:90%;object-fit:contain}
.up button{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--em);color:#fff;display:grid;place-items:center}
.up button .ic{width:16px;height:16px}
.dft{padding:16px 22px 20px;background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;box-shadow:0 -14px 30px -24px rgba(0,0,0,.3)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--cream);border-radius:999px;padding:4px;border:1px solid var(--line)}
.seg button{min-height:40px;border-radius:999px;font-weight:600;font-size:14px;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--em);color:#fff}
.sum{display:flex;justify-content:space-between;font-size:15px;font-variant-numeric:tabular-nums}
.sum.tot{font-size:20px;font-weight:800;color:var(--ink);padding-top:8px;border-top:1px dashed var(--line)}
.sum .free{color:var(--mint);font-weight:700}
.dft .btn{width:100%}
.dempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:50px 10px}
.dempty .bag{width:120px;height:120px;border-radius:50%;background:var(--gold-50);display:grid;place-items:center;color:var(--gold-deep);box-shadow:inset 0 0 0 1.5px rgba(201,163,90,.5)}
.dempty .bag .ic{width:56px;height:56px;stroke-width:1.2}
.dempty h3{font-family:var(--f-bn);font-weight:800;font-size:24px;color:var(--ink)}
.dempty p{margin:0;color:var(--muted)}

.modal{position:fixed;z-index:80;left:50%;top:50%;width:min(1040px,calc(100% - 40px));max-height:calc(100% - 48px);overflow:auto;background:var(--cream);border-radius:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);opacity:0;pointer-events:none;transform:translate(-50%,-46%) scale(.94);transition:opacity .4s,transform .5s var(--ease);box-shadow:0 40px 100px -30px rgba(0,0,0,.6)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.gal{padding:22px;display:flex;flex-direction:column;gap:12px;background:#fff}
.mstage{position:relative;aspect-ratio:1/1.06;border-radius:22px;overflow:hidden;background:var(--mbg);cursor:zoom-in;transition:background .5s}
.mstage .floaty{position:absolute;inset:6% 10% 4%}
.mstage img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 24px 20px rgba(0,0,0,.28));transition:transform .3s ease}
.mstage .stage-shadow{bottom:3%}
.thumbs{display:flex;gap:10px}
.thumbs button{width:76px;height:76px;border-radius:14px;border:2px solid transparent;overflow:hidden;display:grid;place-items:center;transition:border-color .2s,transform .2s}

.thumbs button[aria-pressed="true"]{border-color:var(--em)}
.thumbs img{height:86%;object-fit:contain}
.minfo{position:relative;padding:30px 30px 28px;display:flex;flex-direction:column;gap:12px}
.minfo > *{animation:rise .6s var(--ease) both}
.minfo > *:nth-child(3){animation-delay:.05s}.minfo > *:nth-child(4){animation-delay:.1s}.minfo > *:nth-child(5){animation-delay:.15s}.minfo > *:nth-child(6){animation-delay:.2s}.minfo > *:nth-child(7){animation-delay:.25s}.minfo > *:nth-child(8){animation-delay:.3s}.minfo > *:nth-child(9){animation-delay:.35s}.minfo > *:nth-child(10){animation-delay:.4s}
.minfo .x{position:absolute;top:16px;right:16px;background:#fff}
.crumb{font-size:13.5px;color:var(--muted)}
.crumb b{color:var(--em);font-weight:600}
.minfo h2{font-weight:800;font-size:clamp(26px,2.6vw,34px);line-height:1.15;color:var(--ink);padding-right:48px}
.minfo .alt{font-weight:600;font-size:17px;color:var(--gold-deep);margin-top:-6px}
.minfo .prc .now{font-size:34px}
.minfo .desc{margin:0;font-size:15.5px;line-height:1.75;padding-bottom:6px;border-bottom:1px solid var(--line)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt > span{font-weight:700;font-size:14.5px;color:var(--ink)}
.sw{display:flex;gap:10px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);transition:box-shadow .2s,transform .2s}
.sw button:hover{transform:scale(1.08)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--em)}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.size{min-width:50px;min-height:42px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;transition:all .2s}
.size:hover{border-color:var(--em)}

function renderSlides(keep){

  $("#slides").innerHTML = live.length ? live.map(slideHTML).join("") : '<div class="sl on" style="--bg:'+SBG.emerald.bg+'"><div class="copy"><h2>'+esc(BRAND())+'</h2></div></div>';
  $("#dots").innerHTML = live.map(function(s, i){ return '<button class="sdot" aria-label="'+(i+1)+'"></button>'; }).join("");
  $("#dots").hidden = live.length < 2; $("#prev").hidden = $("#next").hidden = live.length < 2;
  $$("#dots .sdot").forEach(function(d, i){ d.addEventListener("click", function(){ go(i); play(); }); });
  go(cur, true); play();
}
function go(n, silent){
  var els = $$("#slides .sl"), ds = $$("#dots .sdot"); if(!els.length) return;
  cur = (n + els.length) % els.length;
  els.forEach(function(el, i){ el.classList.toggle("on", i === cur); });
  ds.forEach(function(el, i){ if(i === cur) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current"); });
  runProg();
}
function runProg(){
  var pr = $("#prog"); if(reduce || liveSlides().length < 2){ pr.style.width = "0"; return; }
  pr.style.transition = "none"; pr.style.width = "0"; void pr.offsetWidth;
  pr.style.transition = "width " + (cfg.interval * 1000) + "ms linear"; pr.style.width = "100%";
}
function play(){ stop(); if(reduce || liveSlides().length < 2) return; timer = setInterval(function(){ go(cur + 1); }, cfg.interval * 1000); runProg(); }
function stop(){ clearInterval(timer); var pr = $("#prog"); pr.style.transition = "none"; pr.style.width = "0"; }
$("#prev").addEventListener("click", function(){ go(cur - 1); play(); });
$("#next").addEventListener("click", function(){ go(cur + 1); play(); });
var sld = $("#slider"), sx = null;
sld.addEventListener("mouseenter", stop); sld.addEventListener("mouseleave", play);
sld.addEventListener("touchstart", function(e){ sx = e.touches[0].clientX; }, {passive:true});
sld.addEventListener("touchend", function(e){ if(sx === null) return; var dx = e.changedTouches[0].clientX - sx; if(Math.abs(dx) > 45){ go(cur + (dx < 0 ? 1 : -1)); play(); } sx = null; });
sld.addEventListener("mousemove", function(e){
  if(reduce) return;
  var r = sld.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  var el = $$("#slides .sl")[cur]; if(!el) return;

    + (val ? '<div class="vstat'+(mv ? '' : ' bad')+'">'+(mv ? ic("check") + (isUp ? 'Uploaded video ready' : mv.name + ' video found') + (mv.type === "file" ? ' · plays silently in the background' : ' · adds a “Product video” button') : ic("info") + 'Not a YouTube, Facebook or video-file link')+'<button class="lnkbtn" data-act="clearvid" data-path="'+path+'">Remove</button></div>' : ''); };
var upl = function(path, img, contain){ return '<div class="imgrow"><span class="pv'+(contain ? ' contain' : '')+'" style="background-image:url(\''+(img ? I(img) : '')+'\')"></span><label class="up-btn">'+ic("upload")+'Upload image · ছবি দিন<input type="file" accept="image/*" data-img="'+path+'"></label>'+(img && img.indexOf("data:") === 0 ? '<button class="lnkbtn" data-act="clearimg" data-path="'+path+'">Remove</button>' : '')+'</div>'; };
function renderCZ(){
  $("#czTabs").innerHTML = CZT.map(function(x){ return '<button role="tab" aria-selected="'+(x[0] === czTab)+'" data-cztab="'+x[0]+'">'+esc(x[1])+'</button>'; }).join("");
  var h = "";
  if(czTab === "slider"){
    h += '<div class="blk"><label class="fld">Auto-slide every (seconds) · কত সেকেন্ড পর পর<input type="number" min="3" max="20" step=".5" data-path="interval" data-num="1" value="'+esc(cfg.interval)+'"></label></div>';
    h += cfg.slides.map(function(s, i){
      var title = tx(s.h) || (s.img === "cover" ? "Brand cover photo" : "Slide " + (i + 1));
      return '<div class="blk'+(s.on ? '' : ' off')+'"><div class="blk-h"><b>'+(i + 1)+'. '+esc(title)+'</b>'
        + '<button class="mini" data-act="up" data-i="'+i+'"'+(i === 0 ? ' disabled' : '')+' aria-label="Move up">'+ic("up2")+'</button>'
        + '<button class="mini" data-act="down" data-i="'+i+'"'+(i === cfg.slides.length - 1 ? ' disabled' : '')+' aria-label="Move down">'+ic("down2")+'</button>'
        + '<button class="mini danger" data-act="del" data-i="'+i+'" aria-label="Delete">'+ic("trash")+'</button></div>'
        + toggle("slides." + i + ".on", s.on, "Show this slide · দেখাও")
        + '<div class="fld">Banner image · ব্যানার ছবি (empty = illustrated design)</div>' + upl("slides." + i + ".img", s.img)
        + '<div class="fld">Phone banner · মোবাইলের ছবি <span style="font-weight:500">(optional · e.g. 1080×1080 or 1080×1350)</span></div>' + upl("slides." + i + ".imgM", s.imgM)
        + '<div class="two"><label class="fld">On phones · ফোনে<select data-path="slides.'+i+'.fit"><option value="fit"'+(s.fit !== "fill" ? ' selected' : '')+'>No crop · পুরো ছবি</option><option value="fill"'+(s.fit === "fill" ? ' selected' : '')+'>Fill · ভরাট</option></select></label>'
        + '<label class="fld">Keep in view · যে অংশ দেখাবে<select data-path="slides.'+i+'.pos">' + [["top","Top · উপর"],["upper","Upper · উপরের দিক"],["center","Middle · মাঝ"],["lower","Lower · নিচের দিক"],["bottom","Bottom · নিচ"],["left","Left · বাম"],["right","Right · ডান"]].map(function(o){ return '<option value="'+o[0]+'"'+((s.pos || "center") === o[0] ? ' selected' : '')+'>'+o[1]+'</option>'; }).join("") + '</select></label></div>'
        + vfield("slides." + i + ".vid", s.vid)
        + (s.img === "cover" ? '<button class="lnkbtn" style="align-self:flex-start;color:var(--muted)" data-act="nocover" data-i="'+i+'">Use illustrated design instead</button>' : '')
        + pair("Heading · শিরোনাম", "slides." + i + ".h", s.h)
        + pair("Small label · ছোট লেবেল", "slides." + i + ".pill", s.pill)
        + pair("Text · বিবরণ", "slides." + i + ".p", s.p, true)
        + pair("Button text · বোতাম", "slides." + i + ".btn", s.btn)
        + '<div class="two"><label class="fld">Button link · লিংক<select data-path="slides.'+i+'.link">'+linkOpts(s.link)+'</select></label><label class="fld">Background · ব্যাকগ্রাউন্ড<select data-path="slides.'+i+'.bg">'+bgOpts(SBG, s.bg)+'</select></label></div>'
        + '</div>';
    }).join("");
    h += '<div class="addrow"><button class="btn b-em" data-act="addslide">'+ic("plus")+'Add slide · স্লাইড যোগ</button></div>';
  } else if(czTab === "banners"){
    h += cfg.promos.map(function(c, i){
      return '<div class="blk'+(c.on ? '' : ' off')+'"><div class="blk-h"><b>Banner '+(i + 1)+' · '+esc(tx(c.h))+'</b>'
        + '<button class="mini" data-act="pup" data-i="'+i+'"'+(i === 0 ? ' disabled' : '')+' aria-label="Move up">'+ic("up2")+'</button>'
        + '<button class="mini" data-act="pdown" data-i="'+i+'"'+(i === cfg.promos.length - 1 ? ' disabled' : '')+' aria-label="Move down">'+ic("down2")+'</button></div>'
        + toggle("promos." + i + ".on", c.on, "Show · দেখাও") + upl("promos." + i + ".img", c.img, true)
        + '<label class="fld">Keep in view (photo banners) · যে অংশ দেখাবে<select data-path="promos.'+i+'.pos">' + [["top","Top · উপর"],["upper","Upper · উপরের দিক"],["center","Middle · মাঝ"],["lower","Lower · নিচের দিক"],["bottom","Bottom · নিচ"],["left","Left · বাম"],["right","Right · ডান"]].map(function(o){ return '<option value="'+o[0]+'"'+((c.pos || "center") === o[0] ? ' selected' : '')+'>'+o[1]+'</option>'; }).join("") + '</select></label>'
        + vfield("promos." + i + ".vid", c.vid)
        + pair("Title · শিরোনাম", "promos." + i + ".h", c.h) + pair("Label · লেবেল", "promos." + i + ".k", c.k)
        + '<div class="two"><label class="fld">Link · লিংক<select data-path="promos.'+i+'.link">'+linkOpts(c.link)+'</select></label><label class="fld">Colour · রঙ<select data-path="promos.'+i+'.bg">'+bgOpts(PBG, c.bg)+'</select></label></div></div>';
    }).join("");
    h += '<div class="blk"><div class="blk-h"><b>Brand banner · ব্র্যান্ড ব্যানার</b></div>' + pair("Heading · শিরোনাম", "bb.h", cfg.bb.h) + pair("Line · লাইন", "bb.line", cfg.bb.line) + '</div>';
  } else if(czTab === "brand"){
    h += '<div class="blk"><div class="blk-h"><b>Logo & name · লোগো ও নাম</b></div>'
      + '<label class="fld">Website name · ওয়েবসাইটের নাম<input type="text" data-path="brand.name" value="'+esc(cfg.brand.name)+'"></label>'
      + upl("brand.logo", cfg.brand.logo || "logo-dark", true)
      + '<p style="margin:0;font-size:12.5px;color:var(--muted)">Use a PNG with a transparent background for the best result. · স্বচ্ছ ব্যাকগ্রাউন্ডের PNG দিন।</p></div>';
    h += '<div class="blk"><div class="blk-h"><b>Announcement bar · উপরের ঘোষণা</b></div>' + toggle("tickerOn", cfg.tickerOn, "Show · দেখাও")
      + cfg.ticker.map(function(x, i){ return '<div class="blk-h" style="align-items:flex-end">' + '<div style="flex:1">' + pair("Line " + (i + 1), "ticker." + i, x) + '</div><button class="mini danger" data-act="tdel" data-i="'+i+'" aria-label="Delete">'+ic("trash")+'</button></div>'; }).join("")
      + '<div class="addrow"><button class="btn b-out" data-act="tadd">'+ic("plus")+'Add line · লাইন যোগ</button></div></div>';
    h += '<div class="blk"><div class="blk-h"><b>Delivery · ডেলিভারি চার্জ (৳)</b></div><div class="two">'
      + '<label class="fld">Inside Dhaka<input type="number" min="0" data-num="1" data-path="delivery.inside" value="'+cfg.delivery.inside+'"></label>'
      + '<label class="fld">Outside Dhaka<input type="number" min="0" data-num="1" data-path="delivery.outside" value="'+cfg.delivery.outside+'"></label></div>'
      + '<label class="fld">Free delivery from (Dhaka) · ফ্রি ডেলিভারি সীমা<input type="number" min="0" data-num="1" data-path="delivery.free" value="'+cfg.delivery.free+'"></label></div>';
  } else {
    h += '<div class="blk"><div class="blk-h"><b>Colour theme · রঙের থিম</b></div><div class="skin">'
      + [["emerald","Emerald & Gold",["#0F3B33","#C9A35A","#FBF7F0"]],["noir","Noir (brand black)",["#141210","#C9A35A","#FBF7F0"]]].map(function(s){ return '<button data-skin="'+s[0]+'" aria-pressed="'+(cfg.skin === s[0])+'"><span>'+s[2].map(function(c){ return '<i style="background:'+c+';border:1px solid #0002"></i>'; }).join("")+'</span>'+esc(s[1])+'</button>'; }).join("")
      + '</div></div>';
    h += '<div class="blk"><div class="blk-h"><b>Add to Cart button colour · কার্ট বোতামের রঙ</b></div><div class="skin">'
      + [["ghorer","Ghorer Bazar style · কমলা আউটলাইন",["#FFFFFF","#F7931E","#E07B00"]],["gold","Gold · সোনালি",["#F3DFA8","#C9A35A","#A9843F"]],["emerald","Emerald · সবুজ",["#1B6252","#0F3B33","#0B2E28"]],["orange","Orange · কমলা",["#FFB15C","#F7931E","#E07B00"]],["black","Black & gold · কালো",["#3A3530","#171512","#C9A35A"]]].map(function(s){ return '<button data-btnc="'+s[0]+'" aria-pressed="'+((cfg.btn || "ghorer") === s[0])+'"><span>'+s[2].map(function(c){ return '<i style="background:'+c+';border:1px solid #0002"></i>'; }).join("")+'</span>'+esc(s[1])+'</button>'; }).join("")
      + '</div><p style="margin:0;font-size:12.5px;color:var(--muted)">Used for Add to Cart, Buy Now and Checkout on the website.</p></div>';
    h += '<div class="blk"><div class="blk-h"><b>Reset · আগের অবস্থায় ফেরত</b></div><p style="margin:0;font-size:13.5px;color:var(--muted)">Puts every slide, banner and setting back to the original demo.</p><div class="addrow"><button class="btn b-out" data-act="reset">Reset demo · রিসেট</button></div></div>';
  }
  $("#czBody").innerHTML = h;
}
function getPath(path){ return path.split(".").reduce(function(o, k){ return o == null ? o : o[k]; }, cfg); }
function setPath(path, val){ var ks = path.split("."), o = cfg; for(var i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
var rTimer;
function liveRefresh(path){
  clearTimeout(rTimer);
  rTimer = setTimeout(function(){
    saveCfg();
    var root = path.split(".")[0];
    if(root === "slides" || root === "interval") renderSlides(true);
    else if(root === "promos") renderPromos();
    else if(root === "bb") renderBB();
    else if(root === "ticker" || root === "tickerOn"){ renderTicker(); applyStatic(); }
    else if(root === "delivery"){ saveCart(); renderCart(); }
    else applyStatic();
  }, 180);
}
$("#czBody").addEventListener("input", function(e){
  var el = e.target; if(!el.dataset.path) return;
  var v = el.type === "checkbox" ? el.checked : el.dataset.num ? Math.max(0, parseFloat(el.value) || 0) : el.value;
  if(el.dataset.path === "interval") v = Math.min(20, Math.max(3, v || 6.5));
  setPath(el.dataset.path, v);
  if(el.type === "checkbox"){ var b = el.closest(".blk"); if(b && /\.on$/.test(el.dataset.path)) b.classList.toggle("off", !v); }
  liveRefresh(el.dataset.path);
});
$("#czBody").addEventListener("change", function(e){
  var el = e.target;
  if(el.dataset.img && el.files && el.files[0]){
    var path = el.dataset.img, f = el.files[0];
    readImg(f, path.indexOf("brand") === 0 ? 600 : 1800, function(url){ setPath(path, url); saveCfg(); renderAfterImg(path); renderCZ(); });
  } else if(el.dataset.vidup && el.files && el.files[0]){
    var vp = el.dataset.vidup; saveVideoFile(el.files[0], function(ref){ setPath(vp, ref); saveCfg(); renderAfterImg(vp); renderCZ(); toast("Video uploaded", el.files[0].name); });
  } else if(el.tagName === "SELECT"){ setPath(el.dataset.path, el.value); liveRefresh(el.dataset.path); }
});
function renderAfterImg(path){ var r = path.split(".")[0]; if(r === "slides") renderSlides(true); else if(r === "promos") renderPromos(); else applyStatic(); }
function readImg(file, maxW, cb){
  if(!/^image\//.test(file.type)){ toast("Please choose an image file", "PNG / JPG / WebP"); return; }
  var r = new FileReader();
  r.onload = function(){ var im = new Image(); im.onload = function(){
    var s = Math.min(1, maxW / im.width), c = document.createElement("canvas");
    c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    var fmt = typeof imgFormat === "function" ? imgFormat(file.type === "image/png") : (file.type === "image/png" ? "image/png" : "image/jpeg");
    cb(c.toDataURL(fmt, fmt === "image/png" ? undefined : .86));
  }; im.onerror = function(){ toast("That image could not be read", "Try another file"); }; im.src = r.result; };
  r.readAsDataURL(file);
}
$("#cz").addEventListener("click", function(e){
  var b;
  if((b = e.target.closest("[data-cztab]"))){ czTab = b.dataset.cztab; renderCZ(); $("#czBody").scrollTop = 0; return; }
  if((b = e.target.closest("[data-btnc]"))){ cfg.btn = b.dataset.btnc; saveCfg(); applyStatic(); renderCZ(); logA("Button colour changed", cfg.btn); return; }
  if((b = e.target.closest("#cz [data-skin]"))){ cfg.skin = b.dataset.skin; saveCfg(); applyStatic(); renderCZ(); return; }
  if((b = e.target.closest("[data-close]"))){ closeAll(); return; }
  b = e.target.closest("[data-act]"); if(!b) return;
  var i = +b.dataset.i, a = b.dataset.act, S = cfg.slides, Pm = cfg.promos;
  var swap = function(arr, x, y){ var tmp = arr[x]; arr[x] = arr[y]; arr[y] = tmp; };
  if(a === "up") swap(S, i, i - 1);
  else if(a === "down") swap(S, i, i + 1);
  else if(a === "del"){ if(S.length <= 1){ toast("Keep at least one slide", "কমপক্ষে একটি স্লাইড রাখুন"); return; } S.splice(i, 1); }
  else if(a === "addslide"){ S.push({on:true, img:"", bg:"navy", art:["n1"], pill:{bn:"নতুন",en:"New"}, h:{bn:"নতুন স্লাইড",en:"New slide"}, p:{bn:"এখানে আপনার লেখা দিন।",en:"Write your text here."}, btn:{bn:"এখনই কিনুন",en:"Shop Now"}, link:"all"}); }
  else if(a === "nocover"){ S[i].img = ""; S[i].art = ["b2","b1","n2"]; S[i].h = {bn:"প্রিমিয়াম বোরকা",en:"Premium Burka"}; }
  else if(a === "pup") swap(Pm, i, i - 1);
  else if(a === "pdown") swap(Pm, i, i + 1);
  else if(a === "tadd") cfg.ticker.push({bn:"নতুন ঘোষণা",en:"New announcement"});
  else if(a === "tdel") cfg.ticker.splice(i, 1);
  else if(a === "clearvid"){ setPath(b.dataset.path, ""); }
  else if(a === "clearimg"){ var path = b.dataset.path, def = getPath.call(null, path); var parts = path.split("."); var root = parts[0];
    if(root === "brand") cfg.brand.logo = "";
    else if(root === "promos") cfg.promos[+parts[1]].img = DEF.promos[+parts[1]] ? DEF.promos[+parts[1]].img : "b1";
    else setPath(path, ""); }
  else if(a === "reset"){ cfg = clone(DEF); saveCfg(); renderAll(); renderCZ(); toast("Demo reset", "রিসেট হয়েছে"); return; }
  saveCfg(); renderSlides(true); renderPromos(); renderTicker(); applyStatic(); renderCZ();
});
$("#openCz").addEventListener("click", function(){ renderCZ(); openPanel($("#cz")); });

// ================= boot =================
function renderAll(keepSlide){
  applyStatic(); renderTicker(); renderSlides(keepSlide); renderPromos(); renderCats(); renderTop(); renderBB();
  renderTabs(); renderGrids(); renderNav(); renderMenu(); renderChips(); saveCart();
  if($("#cart").classList.contains("on")) renderCart();
  if($("#pm").classList.contains("on")) renderPMInfo();
  if($("#search").classList.contains("on")) runSearch();
  observe();
}
paintIcons();
renderAll();
})();
</script>
